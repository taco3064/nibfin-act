name: CI
on:
  pull_request:
  push:
    branches: [main, 'bootstrap/**']
permissions:
  contents: read
jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch the exact push comparison base
        if: >-
          github.event_name == 'push' &&
          github.event.before != '0000000000000000000000000000000000000000'
        env:
          SOURCE_BEFORE: ${{ github.event.before }}
        run: git fetch --no-tags origin "$SOURCE_BEFORE"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global npm@11.9.0 --ignore-scripts
      - run: npm ci --ignore-scripts
      - name: Select affected integration tests
        id: affected
        run: node scripts/test-changes.mjs --integration
      - run: npm run verify
      - name: Read the reviewed producer pin
        id: core-pin
        if: steps.affected.outputs.integration == 'true'
        run: |
          node -p "'commit=' + require('./core-source.json').commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        if: steps.affected.outputs.integration == 'true'
        with:
          repository: taco3064/nibfin-core
          ref: ${{ steps.core-pin.outputs.commit }}
          path: .core-fixture
          persist-credentials: false
      - name: Verify and install the real candidate in the disposable CI VM
        if: steps.affected.outputs.integration == 'true'
        run: node scripts/core-integration.mjs .core-fixture
      - name: Exercise installed Core admission and Action outcome contracts
        if: steps.affected.outputs.integration == 'true'
        run: node --test scripts/core-contract.mjs
      - name: Invoke the real Action and Core CLI without stage authority
        id: native-denial
        if: steps.affected.outputs.integration == 'true'
        continue-on-error: true
        uses: ./
        with:
          issue-number: '42'
          stage: not-a-stage
      - name: Assert the real Core denial crossed the Action boundary
        if: steps.affected.outputs.integration == 'true'
        env:
          OUTCOME: ${{ steps.native-denial.outcome }}
          STATUS: ${{ steps.native-denial.outputs.status }}
          CODE: ${{ steps.native-denial.outputs.code }}
          RECEIPT: ${{ steps.native-denial.outputs.receipt-hash }}
        run: |
          test "$OUTCOME" = failure
          test "$STATUS" = denied
          test "$CODE" = INVALID_STAGE_REQUEST
          test -z "$RECEIPT"
      - name: Remove the disposable installation and source fixture
        if: always() && steps.affected.outputs.integration == 'true'
        run: |
          if test -d /opt/nibfin/core; then
            sudo rm -r /opt/nibfin/core
            sudo rmdir /opt/nibfin
          fi
          rm -rf .core-fixture
